name: Collect outage schedule JSON

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Collect JSON
        env:
          REGION: ${{ secrets.REGION }}
          CITY: ${{ secrets.CITY }}
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
        run: node src/monitor.js > schedule.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dtek-schedule
          path: schedule.json
