name: DTEK Telegram notifications

on:
  workflow_dispatch:
  schedule:
    - cron: '7,27,47 * * * *'

permissions:
  contents: read

concurrency:
  group: dtek-notify
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Restore encrypted baseline
        id: baseline
        uses: actions/cache/restore@v5
        with:
          path: artifacts/alert-state/baseline.enc
          key: dtek-alert-v1-${{ github.ref }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dtek-alert-v1-${{ github.ref }}-
      - name: Check DTEK and notify Telegram
        env:
          REGION: ${{ secrets.REGION }}
          CITY: ${{ secrets.CITY }}
          STREET: ${{ secrets.STREET }}
          HOUSE: ${{ secrets.HOUSE }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DTEK_STATE_SECRET: ${{ secrets.DTEK_STATE_SECRET }}
        run: node src/notify.js
      - name: Save encrypted baseline
        uses: actions/cache/save@v5
        with:
          path: artifacts/alert-state/baseline.enc
          key: ${{ steps.baseline.outputs.cache-primary-key }}
